services:
  - type: web
    name: exam-events
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: exam-data
      mountPath: /var/data
      sizeGB: 1
