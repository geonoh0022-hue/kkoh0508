services:
  - type: web
    name: exam-period-events
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
